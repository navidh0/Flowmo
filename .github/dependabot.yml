version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      # All routine minor/patch bumps — dev tooling and production dependencies alike — land
      # together in one PR; anything with a major version change still gets its own PR.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # electron-vite 5.0.0 (latest) peers vite ^5 || ^6 || ^7, and @vitejs/plugin-react 6
      # requires vite 8 — revisit when electron-vite supports vite 8.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    groups:
      # All routine minor/patch action bumps land together in one PR; a major version change
      # still gets its own PR.
      minor-and-patch:
        update-types: ['minor', 'patch']
