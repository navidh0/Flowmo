version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # Routine dev-tooling bumps (typecheck, test, build) land together; anything with a
      # major version change or a production dependency still gets its own PR.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    ignore:
      # electron-vite 5.0.0 (latest) peers vite ^5 || ^6 || ^7, and @vitejs/plugin-react 6
      # requires vite 8 — revisit when electron-vite supports vite 8.
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types: ['minor', 'patch']
