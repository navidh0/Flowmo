# The gate every change passes: typecheck, unit tests, a real build, a packaging drift check
# of each platform's release/ output, and one end-to-end run against the actual packaged app
# (not just the unpackaged dev build) on both platforms. That's the PR gate, run once per PR
# (not once per push and again per pull_request sync). The release gate is this same workflow
# called with `release: true`: on top of everything above it also installs the packaged app
# (NSIS on Windows, deb on Linux) and re-runs the full e2e suite against the *installed* copy
# — the one artefact shape a real release ships that ordinary PR CI doesn't need to re-prove
# on every push. Both platforms now have a window manager on CI (Windows always has one; Linux
# gets openbox under Xvfb via e2e/xvfb-wm.sh), so minimize is exercised everywhere (v0.4 ports
# the app itself, and ships a Linux AppImage + deb alongside the existing Windows NSIS
# installer + portable exe).
name: CI

on:
  pull_request:
    # A docs-only change can't affect typecheck/tests/build/e2e/drift, so skip the round trip.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:
    inputs:
      # release.yml sets this true to run this workflow as its release gate: beyond the PR
      # checks, it installs the packaged app and re-runs e2e against the installed copy. Left
      # false (the default), this is the ordinary, cheaper PR gate.
      release:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      # Lets a maintainer run the heavier release-shaped gate by hand, without going through
      # release.yml, e.g. to debug an install/uninstall failure in isolation.
      release:
        description: 'Also install the packaged app and re-run e2e against it, as a release gate would'
        type: boolean
        default: false

permissions:
  contents: read

# Keyed on the calling workflow too: when Release reuses this as its gate (via workflow_call,
# triggered by a push to main), it must not share — and cancel — the group of a manual
# workflow_dispatch run of CI itself against that same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # electron's postinstall (during npm ci, below) and electron-builder's packaging step
      # both download large binaries from the network; caching them keyed on the lockfile
      # skips that download whenever dependencies haven't changed. Must run before npm ci,
      # since that's the step whose postinstall does the electron download.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package installers
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Packaging drift check
        run: node e2e/drift.mjs release
      - name: Copy app.asar out for the release gate's cross-platform drift check
        if: inputs.release == true
        # Only meaningful when this run is release.yml's gate: the release set uploaded below
        # carries installers, never an unpacked tree, so the publish job's Windows-vs-Linux
        # drift check (e2e/drift.mjs --require-cross-platform) would otherwise have nothing to
        # compare. app-win.asar is not itself a release asset — publish's upload step uploads
        # an explicit allowlist that leaves it out.
        shell: pwsh
        run: Copy-Item release/win-unpacked/resources/app.asar release/app-win.asar
      - name: Upload release set
        if: inputs.release == true
        # Only when this is the release gate: release.yml's publish job downloads this by
        # name (pattern: release-*) and expects exactly these files under dist/release-windows.
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          # The NSIS blockmap and latest.yml are electron-updater's Windows update feed; they
          # must ship alongside the installers or installed apps can never see this version.
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/app-win.asar
          if-no-files-found: error
          retention-days: 3
      - name: End-to-end (packaged, win-unpacked exe)
        run: npm run e2e -- --app release/win-unpacked/Flowdo.exe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-windows-win-unpacked
          path: e2e/out/
          if-no-files-found: ignore
          retention-days: 7
      - name: Silently install the NSIS installer
        if: inputs.release == true
        # perMachine: false in electron-builder.yml means this is a per-user install, landing
        # in $env:LOCALAPPDATA\Programs\Flowdo — not a machine-wide Program Files install, and
        # not something `/S` needs admin rights for. -Wait is required: without it the e2e
        # step below would race the installer's own background copy/shortcut steps. The
        # variable is braced (${env:VERSION}) rather than bare ($env:VERSION.exe): in a
        # double-quoted pwsh string a bare variable reference immediately followed by
        # `.exe` is parsed as member access on the variable (a `.exe` property lookup),
        # not as the variable's value followed by literal text — bracing it avoids that.
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Start-Process -FilePath "release\Flowdo-Setup-${env:VERSION}.exe" -ArgumentList '/S' -Wait
      - name: End-to-end (installed app)
        if: inputs.release == true
        shell: pwsh
        run: npm run e2e -- --app "$env:LOCALAPPDATA\Programs\Flowdo\Flowdo.exe"
      - uses: actions/upload-artifact@v7
        if: inputs.release == true && failure()
        with:
          name: e2e-windows-installed
          path: e2e/out/
          if-no-files-found: ignore
          retention-days: 7
      - name: End-to-end (portable exe) — not run
        # electron-builder's portable target is a self-extracting launcher: the process
        # Playwright would spawn immediately re-execs a *different*, freshly extracted
        # Flowdo.exe as a child and exits/detaches, so `_electron.launch()` never attaches
        # to the real app's CDP/inspector endpoint (it only ever sees the launcher). This
        # is a structural limitation of driving a self-extracting wrapper, not something a
        # timeout or retry fixes, so the target is skipped here rather than run against a
        # step that would either hang or pass without ever touching the real app.
        shell: pwsh
        run: |
          Write-Host 'Skipping e2e against release/Flowdo-*-portable.exe: Playwright cannot attach to the self-extracting portable launcher, only to the real Electron process it spawns as a child. See the step comment in .github/workflows/ci.yml for the full reasoning.'

  linux-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # electron's postinstall (during npm ci, below) and electron-builder's packaging step
      # both download large binaries from the network; caching them keyed on the lockfile
      # skips that download whenever dependencies haven't changed. Must run before npm ci,
      # since that's the step whose postinstall does the electron download.
      - name: Cache Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      # openbox gives e2e/xvfb-wm.sh a window manager under Xvfb, so minimize behaves the
      # same as it does on Windows; xvfb-run itself ships on the ubuntu-latest image already,
      # but is included here too in case that image assumption ever changes.
      # dbus-x11 + gnome-keyring give the timeline suite a Secret Service to start, so
      # Electron's safeStorage works and calendars.add() can seed real calendar events here,
      # as it can on Windows via DPAPI. Without them the suite's calendar checks would SKIP.
      - name: Install openbox (+ Xvfb, D-Bus, gnome-keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y openbox xvfb dbus-x11 gnome-keyring
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Read app version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package Linux packages
        run: npx electron-builder --linux --publish never
      - name: Packaging drift check
        run: node e2e/drift.mjs release
      - name: Copy app.asar out for the release gate's cross-platform drift check
        if: inputs.release == true
        # Same reasoning as the Windows job's equivalent step: only installers/packages are
        # otherwise uploaded, so the publish job's cross-platform drift check would never find
        # an asar to compare. Not itself a release asset — see the "Upload release set" step's
        # explicit path allowlist.
        run: cp release/linux-unpacked/resources/app.asar release/app-linux.asar
      - name: Upload release set
        if: inputs.release == true
        # Only when this is the release gate: release.yml's publish job downloads this by
        # name (pattern: release-*) and expects exactly these files under dist/release-linux.
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          # latest-linux.yml is electron-updater's Linux (AppImage) update feed. The AppImage
          # blockmap is only sometimes produced, so it's a best-effort glob rather than a
          # required file.
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
            release/app-linux.asar
          if-no-files-found: error
          retention-days: 3
      - name: Extract the AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/appimage"
          cp "release/Flowdo-$VERSION.AppImage" "$RUNNER_TEMP/appimage/"
          chmod +x "$RUNNER_TEMP/appimage/Flowdo-$VERSION.AppImage"
          ( cd "$RUNNER_TEMP/appimage" && "./Flowdo-$VERSION.AppImage" --appimage-extract )
      - name: End-to-end (extracted AppImage)
        run: e2e/xvfb-wm.sh npm run e2e -- --app "$RUNNER_TEMP/appimage/squashfs-root/flowdo"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-linux-appimage
          path: e2e/out/
          if-no-files-found: ignore
          retention-days: 7
      - name: Install the deb package
        if: inputs.release == true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y "./release/flowdo_${VERSION}_amd64.deb"
      - name: End-to-end (installed deb)
        if: inputs.release == true
        run: e2e/xvfb-wm.sh npm run e2e -- --app /opt/Flowdo/flowdo
      - uses: actions/upload-artifact@v7
        if: inputs.release == true && failure()
        with:
          name: e2e-linux-deb-installed
          path: e2e/out/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove the deb package
        if: inputs.release == true
        run: sudo apt-get remove -y flowdo
      - name: Assert the deb really uninstalled (/opt/Flowdo gone)
        if: inputs.release == true
        run: |
          set -euo pipefail
          if [ -d /opt/Flowdo ]; then
            echo "::error::/opt/Flowdo still exists after apt-get remove -y flowdo"
            exit 1
          fi

  # Fast, dependency-light checks that don't need a Windows/Linux build+e2e round trip:
  # the project's own mechanical invariants (scripts/sweep.mjs) and a production-dependency
  # vulnerability audit. Runs under workflow_call too, so it also gates releases.
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 pulls full history for every branch (not just the triggering ref), so
      # `origin/<base_ref>` below always resolves, both for a same-repo PR and for release.yml
      # reusing this workflow on a push to main (where the commit-range step is skipped).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Project invariants (sweep)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            npm run sweep -- --commits "origin/$BASE_REF..HEAD"
          else
            npm run sweep
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
