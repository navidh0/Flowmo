# Publishes a release when main carries a version that has no tag yet — bump package.json,
# add docs/releases/vX.Y.Z.md, merge, and this does the rest: the CI workflow as a gate (with
# `release: true`, so it also installs the packaged app and re-runs e2e against it on both
# platforms, on top of everything an ordinary PR gate already does — including the packaging
# drift check and the packaged-app e2e run, both against the *same* release/ output this job
# then reuses), a cross-platform drift check with both platforms' artefacts side by side, an
# annotated tag, and a GitHub Release with the notes and every artefact. Nothing is published
# unless every check passes on this exact commit and every expected file is actually present
# to upload. Gate and publish share the gate's build instead of building the installers twice.
#
# workflow_dispatch also takes a `dry_run` input (default true): it runs the full gate and the
# publish job's checks — download, expected-files, cross-platform drift — against a real build,
# but stops short of tagging or publishing. Truth table (only workflow_dispatch has a dry_run
# dimension; push to main never does):
#
#   event              | tagged? | dry_run | detect.needed | publish tags/releases?
#   -------------------|---------|---------|----------------|------------------------
#   push to main        | no      | (n/a)   | true           | yes — real release
#   push to main        | yes     | (n/a)   | false          | n/a — gate/publish skipped
#   workflow_dispatch   | no      | false   | true           | yes — real release
#   workflow_dispatch   | no      | true    | true           | no — dry run only
#   workflow_dispatch   | yes     | false   | false          | n/a — gate/publish skipped
#   workflow_dispatch   | yes     | true    | true           | no — dry run only
#
# `github.event.inputs.dry_run` (and the `inputs` context) is unset on a push, so the
# `inputs.dry_run == true` checks below are false by default for that event — a push can never
# be treated as a dry run, and (via the `tagged` check ahead of the docs-file requirement) can
# never re-publish an already-tagged version either. Only an explicit workflow_dispatch with
# dry_run=true skips tagging, and only workflow_dispatch with dry_run=false (or the docs-file
# requirement failing) can block a genuinely new version from publishing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the gate and publish preflight without tagging or publishing'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          # Only a manual workflow_dispatch run ever sets this; it's absent (falsy) for the
          # push trigger, so a push can never be mistaken for a dry run. See the truth table
          # in this file's header comment.
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          tagged=false
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            tagged=true
          fi
          if [ "$tagged" = "true" ] && [ "$DRY_RUN" != "true" ]; then
            echo "v$version is already tagged; nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Either a real release is due (untagged), or this is a dry run exercising the gate
          # and publish preflight against an already-tagged version — both still need release
          # notes, since the gate and the "expected files" / drift checks below are meant to
          # reflect what a real release of this version would actually do.
          if [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::package.json is at $version but docs/releases/v$version.md is missing. Release notes are required."
            exit 1
          fi
          if [ "$tagged" = "true" ]; then
            echo "v$version is already tagged; dry_run=true was requested, so running the gate and publish preflight anyway without tagging or publishing."
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

  # Runs the same checks a PR gets, plus (release: true) installs the packaged app and re-runs
  # e2e against it on both platforms — the one artefact shape a real release ships that PR CI
  # doesn't re-prove on every push. Its windows and linux-suite jobs also produce this
  # release's actual installers (release-windows / release-linux artifacts), which publish
  # (below) downloads rather than building a second time.
  gate:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    # Narrower than this workflow's own contents: write — the gate never tags or publishes,
    # it only builds and tests. A reusable workflow call is capped at the intersection of the
    # caller's grant and its own declared `permissions:` (ci.yml itself already declares
    # contents: read), so this is belt-and-suspenders, not load-bearing, but it documents the
    # intent at the call site too.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [detect, gate]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      DRY_RUN: ${{ needs.detect.outputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: e2e/drift.mjs is a static check over already-built release
      # artefacts, so it never needs electron's own postinstall (which downloads the
      # Electron binary) or any other build step — just whatever npm packages it imports.
      - run: npm ci --ignore-scripts
      - name: Download build artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
      - name: Verify every expected file is present
        run: |
          set -euo pipefail
          # Windows: NSIS + portable installers, the NSIS blockmap, and the Windows update
          # feed. Linux: AppImage + deb, and the Linux update feed. The AppImage blockmap is
          # not required: electron-builder doesn't always produce one.
          expected=(
            "dist/release-windows/Flowdo-Setup-$VERSION.exe"
            "dist/release-windows/Flowdo-Setup-$VERSION.exe.blockmap"
            "dist/release-windows/Flowdo-$VERSION-portable.exe"
            "dist/release-windows/latest.yml"
            "dist/release-linux/Flowdo-$VERSION.AppImage"
            "dist/release-linux/flowdo_${VERSION}_amd64.deb"
            "dist/release-linux/latest-linux.yml"
          )
          missing=()
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release v$VERSION is missing expected files; refusing to publish a partial release:"
            printf '::error::  %s\n' "${missing[@]}"
            echo "--- actual contents of dist/ ---"
            find dist -maxdepth 2 -type f
            exit 1
          fi
          # Persisted for the "Tag and publish" step below: it uploads exactly this verified
          # allowlist (plus any *.blockmap present) as release assets — never every file
          # under dist/release-*/, which now also holds the cross-platform drift check's
          # app-win.asar / app-linux.asar helper files (uploaded by ci.yml's windows /
          # linux-suite jobs alongside the installers), and which is not something anyone
          # should be downloading from the release page.
          printf '%s\n' "${expected[@]}" > "$RUNNER_TEMP/expected-assets.txt"
      - name: Packaging drift check (Windows vs Linux)
        # The gate (ci.yml, above, reused as `needs: gate` on every push) already ran the
        # full e2e suite and a same-platform drift check against each platform's own
        # release/ output on its own runner. This is the one check that needs both
        # platforms' artefacts side by side — versions and asar contents must agree between
        # the Windows and Linux builds actually being published together as one release.
        # --require-cross-platform: this is the one run of drift.mjs where both platforms'
        # artefacts are always expected side by side, so a missing comparison (e.g. ci.yml's
        # app-*.asar copy step regressing) must FAIL here, not silently SKIP.
        run: node e2e/drift.mjs --require-cross-platform dist/release-windows dist/release-linux
      - name: Dry run — not tagging or publishing
        if: env.DRY_RUN == 'true'
        run: |
          echo "::notice::dry run: not tagging or publishing v$VERSION. Gate + publish preflight (download, expected-files, cross-platform drift) all passed."
      - name: Tag and publish
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          title=$(head -n 1 "docs/releases/v$VERSION.md" | sed 's/^# *//')
          git tag -a "v$VERSION" -m "$title"
          git push origin "v$VERSION"
          # Publish the page first, then upload each file: a one-shot create with large
          # files once stalled as an empty draft (release skill, v0.3.0).
          tail -n +2 "docs/releases/v$VERSION.md" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          # latest.yml and latest-linux.yml must keep these exact names on the release:
          # electron-updater requests them by name from the latest GitHub release. Upload
          # exactly the "Verify every expected file is present" step's allowlist, plus any
          # *.blockmap present (the AppImage's is best-effort and wasn't in that allowlist) —
          # never every file under dist/release-*/, which also holds the cross-platform
          # check's app-win.asar / app-linux.asar helper files and must not be published.
          declare -A seen=()
          assets=()
          add_asset() {
            if [ -z "${seen[$1]:-}" ]; then
              seen[$1]=1
              assets+=("$1")
            fi
          }
          while IFS= read -r f; do
            add_asset "$f"
          done < "$RUNNER_TEMP/expected-assets.txt"
          for f in dist/release-windows/*.blockmap dist/release-linux/*.blockmap; do
            [ -f "$f" ] || continue
            add_asset "$f"
          done
          echo "Uploading release assets:"
          printf '  %s\n' "${assets[@]}"
          for f in "${assets[@]}"; do
            gh release upload "v$VERSION" "$f" --clobber
          done
          gh release view "v$VERSION" --json assets --jq '.assets[] | "\(.name) \(.size)"'
