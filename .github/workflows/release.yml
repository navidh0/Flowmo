# Publishes a release when main carries a version that has no tag yet — bump package.json,
# add docs/releases/vX.Y.Z.md, merge, and this does the rest: the full CI gate again (which
# itself runs the full e2e suite against every artefact and a same-platform drift check on
# each platform's runner), installers for Windows and Linux (each carrying electron-updater's
# update-feed file, latest.yml / latest-linux.yml, so installed apps can discover the new
# version), a cross-platform drift check with both platforms' artefacts side by side, an
# annotated tag, and a GitHub Release with the notes and every artefact. Nothing is published
# unless every check passes on this exact commit and every expected file is actually present
# to upload.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f "docs/releases/v$version.md" ]; then
            echo "::error::package.json is at $version but docs/releases/v$version.md is missing. Release notes are required."
            exit 1
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  gate:
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml

  build-windows:
    needs: [detect, gate]
    if: needs.detect.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installers
        run: npm run build && npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Copy app.asar out for the cross-platform drift check
        # This artefact only ever carries installers, never an unpacked tree, so the
        # publish job's Windows-vs-Linux drift check (e2e/drift.mjs --require-cross-platform)
        # would otherwise have nothing to compare. app-win.asar is not itself a release
        # asset — the publish job's upload step uploads an explicit allowlist that leaves it
        # out.
        shell: pwsh
        run: Copy-Item release/win-unpacked/resources/app.asar release/app-win.asar
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          # The NSIS blockmap and latest.yml are electron-updater's Windows update feed;
          # they must ship alongside the installers or installed apps can never see this
          # version.
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/app-win.asar
          if-no-files-found: error

  build-linux:
    needs: [detect, gate]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build packages
        run: npm run build && npx electron-builder --linux --publish never
      - name: Copy app.asar out for the cross-platform drift check
        # Same reasoning as build-windows's equivalent step: only installers/packages are
        # otherwise uploaded, so the publish job's cross-platform drift check would never
        # find an asar to compare. Not itself a release asset — see the publish job's
        # explicit upload allowlist.
        run: cp release/linux-unpacked/resources/app.asar release/app-linux.asar
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          # latest-linux.yml is electron-updater's Linux (AppImage) update feed. The
          # AppImage blockmap is only sometimes produced, so it's a best-effort glob rather
          # than a required file.
          path: |
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest-linux.yml
            release/app-linux.asar
          if-no-files-found: error

  publish:
    needs: [detect, build-windows, build-linux]
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: e2e/drift.mjs is a static check over already-built release
      # artefacts, so it never needs electron's own postinstall (which downloads the
      # Electron binary) or any other build step — just whatever npm packages it imports.
      - run: npm ci --ignore-scripts
      - name: Download build artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
      - name: Verify every expected file is present
        run: |
          set -euo pipefail
          # Windows: NSIS + portable installers, the NSIS blockmap, and the Windows update
          # feed. Linux: AppImage + deb, and the Linux update feed. The AppImage blockmap is
          # not required: electron-builder doesn't always produce one.
          expected=(
            "dist/release-windows/Flowdo-Setup-$VERSION.exe"
            "dist/release-windows/Flowdo-Setup-$VERSION.exe.blockmap"
            "dist/release-windows/Flowdo-$VERSION-portable.exe"
            "dist/release-windows/latest.yml"
            "dist/release-linux/Flowdo-$VERSION.AppImage"
            "dist/release-linux/flowdo_${VERSION}_amd64.deb"
            "dist/release-linux/latest-linux.yml"
          )
          missing=()
          for f in "${expected[@]}"; do
            if [ ! -f "$f" ]; then
              missing+=("$f")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release v$VERSION is missing expected files; refusing to publish a partial release:"
            printf '::error::  %s\n' "${missing[@]}"
            echo "--- actual contents of dist/ ---"
            find dist -maxdepth 2 -type f
            exit 1
          fi
          # Persisted for the "Tag and publish" step below: it uploads exactly this verified
          # allowlist (plus any *.blockmap present) as release assets — never every file
          # under dist/release-*/, which now also holds the cross-platform drift check's
          # app-win.asar / app-linux.asar helper files (build-windows / build-linux above),
          # and which is not something anyone should be downloading from the release page.
          printf '%s\n' "${expected[@]}" > "$RUNNER_TEMP/expected-assets.txt"
      - name: Packaging drift check (Windows vs Linux)
        # The gate (ci.yml, above, reused as `needs: gate` on every push) already ran the
        # full e2e suite and a same-platform drift check against each platform's own
        # release/ output on its own runner. This is the one check that needs both
        # platforms' artefacts side by side — versions and asar contents must agree between
        # the Windows and Linux builds actually being published together as one release.
        # --require-cross-platform: this is the one run of drift.mjs where both platforms'
        # artefacts are always expected side by side, so a missing comparison (e.g. a build
        # job's app-*.asar copy step regressing) must FAIL here, not silently SKIP.
        run: node e2e/drift.mjs --require-cross-platform dist/release-windows dist/release-linux
      - name: Tag and publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          title=$(head -n 1 "docs/releases/v$VERSION.md" | sed 's/^# *//')
          git tag -a "v$VERSION" -m "$title"
          git push origin "v$VERSION"
          # Publish the page first, then upload each file: a one-shot create with large
          # files once stalled as an empty draft (release skill, v0.3.0).
          tail -n +2 "docs/releases/v$VERSION.md" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          # latest.yml and latest-linux.yml must keep these exact names on the release:
          # electron-updater requests them by name from the latest GitHub release. Upload
          # exactly the "Verify every expected file is present" step's allowlist, plus any
          # *.blockmap present (the AppImage's is best-effort and wasn't in that allowlist) —
          # never every file under dist/release-*/, which also holds the cross-platform
          # check's app-win.asar / app-linux.asar helper files and must not be published.
          declare -A seen=()
          assets=()
          add_asset() {
            if [ -z "${seen[$1]:-}" ]; then
              seen[$1]=1
              assets+=("$1")
            fi
          }
          while IFS= read -r f; do
            add_asset "$f"
          done < "$RUNNER_TEMP/expected-assets.txt"
          for f in dist/release-windows/*.blockmap dist/release-linux/*.blockmap; do
            [ -f "$f" ] || continue
            add_asset "$f"
          done
          echo "Uploading release assets:"
          printf '  %s\n' "${assets[@]}"
          for f in "${assets[@]}"; do
            gh release upload "v$VERSION" "$f" --clobber
          done
          gh release view "v$VERSION" --json assets --jq '.assets[] | "\(.name) \(.size)"'
