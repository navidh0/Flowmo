# Secret scanning with gitleaks, run on every PR and every push. We invoke the gitleaks
# binary directly instead of gitleaks/gitleaks-action: that Action's own licence gates
# "organization" use behind a separate agreement with the gitleaks maintainers, which doesn't
# fit a public repo we don't want to encumber. Running the OSS binary ourselves has no such
# restriction (gitleaks itself is MIT-licensed) — so we pin a release, verify its checksum
# against the release's own published checksums file, and run it straight.
name: Secret scanning

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history, not just the triggering commit: gitleaks' default `detect` mode scans
      # the git log, and a shallow (depth-1) checkout would only ever see the tip commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLO --fail "$base/$asset"
          curl -sSLO --fail "$base/$checksums"
          grep -F " $asset" "$checksums" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          chmod +x gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan for secrets
        run: |
          set -euo pipefail
          # --redact keeps any matched secret out of the step's log; default --exit-code is 1
          # on findings, which fails the step (and job) without any extra handling here.
          gitleaks detect --source . --redact --verbose
