<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flowdo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Locked down: no remote origins, no inline/eval script. The renderer only ever
         loads local assets, so there is no reason to permit anything else. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
